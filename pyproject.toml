[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyintent"
version = "2.0.0"
description = "Mac-first, local-only AI platform for routing and executing personal assistant tasks"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "TinyIntent Team", email = "team@tinyintent.ai"}
]
keywords = ["ai", "assistant", "local", "macos", "ollama", "coreml"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.104.0,<0.120.0",
    "uvicorn[standard]>=0.24.0,<0.35.0",
    "httpx>=0.25.0,<0.30.0",
    "pydantic>=2.0.0,<3.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "jsonschema>=4.19.0,<5.0.0",
    "pyyaml>=6.0.1,<7.0.0",
    "python-multipart>=0.0.6,<1.0.0",
    "jinja2>=3.1.0,<4.0.0",
    "python-jose[cryptography]>=3.3.0,<4.0.0",
    "passlib[bcrypt]>=1.7.4,<2.0.0",
    "aiofiles>=23.2.1,<25.0.0",
    "watchfiles>=0.21.0,<1.0.0",
    "structlog>=23.0.0,<25.0.0",
    "rich>=13.0.0,<14.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.0,<9.0.0",
    "pytest-asyncio>=0.21.0,<1.0.0",
    "pytest-cov>=4.1.0,<6.0.0",
    "requests>=2.31.0,<3.0.0",
    "responses>=0.23.0,<1.0.0",
]
load = [
    "locust>=2.15.0,<3.0.0",
]
dev = [
    "ruff>=0.1.0,<1.0.0",
    "mypy>=1.6.0,<2.0.0",
    "types-pyyaml>=6.0.0,<7.0.0",
    "types-requests>=2.31.0,<3.0.0",
]
all = [
    "tinyintent[test,dev]"
]

[project.urls]
Homepage = "https://github.com/tinyintent/tinyintent"
Repository = "https://github.com/tinyintent/tinyintent"
Documentation = "https://docs.tinyintent.ai"
"Bug Reports" = "https://github.com/tinyintent/tinyintent/issues"

[project.scripts]
tinyintent = "tinyintent.cli:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["tinyintent*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"tinyintent" = ["*.yaml", "*.yml", "*.json", "*.toml"]
"tinyintent.helpers" = ["*/helper.yaml", "*/input.schema.json", "*/output.schema.json", "*/main.*", "*/health.*"]
"tinyintent.router" = ["*.mlmodel", "data/*.tsv", "data/*.csv", "data/*.json"]

[tool.ruff]
target-version = "py311"
line-length = 88
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "S",   # bandit security
    "A",   # flake8-builtins
    "Q",   # flake8-quotes
    "T20", # flake8-print
    "SIM", # flake8-simplify
    "PIE", # flake8-pie
    "PYI", # flake8-pyi
    "PT",  # flake8-pytest-style
    "RET", # flake8-return
    "ERA", # eradicate
    "PL",  # pylint
    "TRY", # tryceratops
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "B904",  # raise from
    "T201",  # print statements (used for logging)
    "S101",  # assert used (ok in tests)
    "PLR0913", # too many arguments
    "PLR2004", # magic values
    "TRY003", # avoid specifying long messages outside exception class
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"tests/**/*" = ["B011", "F401", "F403"]

[tool.ruff.isort]
known-first-party = ["tinyintent"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
strict_concatenate = true

[[tool.mypy.overrides]]
module = [
    "yaml.*",
    "uvicorn.*",
    "fastapi.*",
    "pydantic.*",
    "httpx.*",
    "jose.*",
    "passlib.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["tinyintent"]
omit = [
    "tests/*",
    "*/test_*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
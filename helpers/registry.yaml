# TinyIntent Helpers Registry
# Defines all registered helpers for the Helpers Framework v1
# M9.1: Safe-by-default configuration for production deployments

version: "1.0"
description: "TinyIntent Helpers Registry - M4 Framework"
manifest_version: 1  # M8.1: Helper Extensibility Framework compatibility

helpers:
  bot_guard:
    name: "Bot Guard"
    description: "M8.0: Live crypto exchange integration with sandbox-only defaults"
    enabled: true
    category: "trading"
    risk_level: "high"
    can_execute: false  # M8.0: Default to safe execution disabled
    manifest_path: "helpers/bot_guard/helper.yaml"
    requires_approval: true
    required_envs:
      - "EXCHANGE_API_KEY"
      - "EXCHANGE_API_SECRET"
      - "EXCHANGE_BASE_URL"
      - "EXCHANGE_MODE"  # M8.0: Required to enforce sandbox mode
    capabilities:
      - "network"  # M8.0: Required for live exchange API calls
    safety_notes: "Sandbox-only by default. Execution requires approval token and EXECUTION_ENABLED=1."
    # M8.3: Helper Lifecycle & Versioning
    version: "2.1.0"
    added: "2024-12-15"
    updated: "2025-08-19"
    maintainer: "TinyIntent Core Team <core@tinyintent.ai>"
    # M10.2: Agent Lifecycle Governance
    lifecycle:
      state: "trusted"  # draft|trusted|deprecated|retired
      since: "2024-12-15"
      notes: "Core helper - production ready"
    # M8.6: Health Check Configuration
    healthcheck: "health.js"
    
  log_tailer:
    name: "Log Tailer"
    description: "Retrieve last N error lines from logs"
    enabled: true
    category: "monitoring"
    risk_level: "low"
    can_execute: false  # M9.1: Safe default - requires explicit opt-in
    manifest_path: "helpers/log_tailer/helper.yaml"
    requires_approval: true  # M9.1: Safe default - require approval for all helpers
    required_envs: []
    capabilities:
      - filesystem
    safety_notes: "Low risk helper for log monitoring. Only reads log files, no system modifications."
    # M8.3: Helper Lifecycle & Versioning
    version: "1.2.1"
    added: "2024-10-05"
    updated: "2025-01-15"
    maintainer: "TinyIntent Monitoring <monitoring@tinyintent.ai>"
    # M10.2: Agent Lifecycle Governance
    lifecycle:
      state: "trusted"  # draft|trusted|deprecated|retired
      since: "2024-10-05"
      notes: "Core monitoring helper - stable"
    # M8.6: Health Check Configuration
    healthcheck: "health.py"
    
  ssh_ops:
    name: "SSH Operations"
    description: "Remote bot management via SSH: restart, status, logs"
    enabled: true
    category: "infrastructure"
    risk_level: "high"  # M9.1: SSH operations are high risk
    can_execute: false  # M9.1: Safe default - requires explicit opt-in
    manifest_path: "helpers/ssh_ops/helper.yaml"
    requires_approval: true
    required_envs:
      - "SSH_HOST"
      - "SSH_USER"
    capabilities:
      - network
      - filesystem
    safety_notes: "Medium risk helper for remote server management. Requires SSH access credentials. Can restart services and affect system state."
    # M8.3: Helper Lifecycle & Versioning (no metadata - testing backward compatibility)
    # version: "0.9.0-beta"
    # added: "2024-11-20" 
    # updated: "2024-12-01"
    # maintainer: "Infrastructure Team <infra@tinyintent.ai>"
    # M10.2: Agent Lifecycle Governance (testing backward compatibility - no lifecycle field)
    # lifecycle:
    #   state: "draft"  # Would default to trusted for core helpers
    #   since: "2024-11-20"
    #   notes: "Testing helper without lifecycle metadata"
    # M8.6: No healthcheck defined - testing backward compatibility
    
  weather:
    name: "Weather Helper"
    description: "Real-time weather data using free Open-Meteo API"
    enabled: true
    category: "information"
    risk_level: "low"
    can_execute: true  # Safe to execute - no system modifications, read-only APIs
    manifest_path: "helpers/weather/helper.yaml"
    requires_approval: false  # Low risk - safe for direct execution
    required_envs: []  # No API keys required - uses free APIs
    capabilities:
      - "network"  # Required for API calls to Open-Meteo and geocoding services
    safety_notes: "Low risk helper for weather information. Uses free APIs with no authentication. No system modifications or sensitive data access."
    # Helper Lifecycle & Versioning
    version: "1.0.0"
    added: "2025-08-23"
    updated: "2025-08-23" 
    maintainer: "TinyIntent Core Team <core@tinyintent.ai>"
    # Agent Lifecycle Governance
    lifecycle:
      state: "trusted"  # Safe for production use
      since: "2025-08-23"
      notes: "Weather information helper - production ready with free APIs"
    # Health Check Configuration
    healthcheck: "health.py"

# Global settings - M9.1: Safe-by-default configuration
settings:
  default_timeout: 5
  max_helpers: 10
  audit_required: true
  preview_only: true  # M4: Only preview mode enabled
  # M9.1: Production safety defaults
  execution_enabled: false  # Requires explicit EXECUTION_ENABLED=1 env var
  default_can_execute: false  # All helpers require explicit opt-in
  default_requires_approval: true  # All helpers require approval by default
  default_risk_level: "high"  # Conservative risk assessment
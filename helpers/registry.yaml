# TinyIntent Helpers Registry
# Defines all registered helpers for the Helpers Framework v1

version: "1.0"
description: "TinyIntent Helpers Registry - M4 Framework"

helpers:
  bot_guard:
    name: "Bot Guard"
    description: "Crypto bot risk management and emergency controls"
    enabled: true
    category: "trading"
    risk_level: "high"
    can_execute: true
    manifest_path: "helpers/bot_guard/helper.yaml"
    requires_approval: true
    required_envs:
      - "EXCHANGE_API_KEY"
      - "EXCHANGE_SECRET"
      - "EXCHANGE_PASSPHRASE"
    safety_notes: "HIGH RISK: This helper can execute real trades and close positions. Ensure exchange credentials are for correct account and consider using sandbox mode for testing."
    
  log_tailer:
    name: "Log Tailer"
    description: "Retrieve last N error lines from logs"
    enabled: true
    category: "monitoring"
    risk_level: "low"
    can_execute: true
    manifest_path: "helpers/log_tailer/helper.yaml"
    requires_approval: false
    required_envs: []
    safety_notes: "Low risk helper for log monitoring. Only reads log files, no system modifications."
    
  ssh_ops:
    name: "SSH Operations"
    description: "Remote bot management via SSH: restart, status, logs"
    enabled: true
    category: "infrastructure"
    risk_level: "medium"
    can_execute: true
    manifest_path: "helpers/ssh_ops/helper.yaml"
    requires_approval: true
    required_envs:
      - "SSH_HOST"
      - "SSH_USER"
    safety_notes: "Medium risk helper for remote server management. Requires SSH access credentials. Can restart services and affect system state."

# Global settings
settings:
  default_timeout: 5
  max_helpers: 10
  audit_required: true
  preview_only: true  # M4: Only preview mode enabled